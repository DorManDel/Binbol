name: Preview BinBol landing from branch

on:
  push:
    branches:
      - preview/binbol-landing-v04
    paths:
      - index.html
      - explorer.html
      - dev.html
      - assets/**
      - docs/**
      - .github/workflows/preview-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Check preview entry points
        shell: bash
        run: |
          test -f index.html
          test -f assets/landing.css
          test -f assets/landing.js
          test -f assets/component-editor.js
          test -f dev.html
          test -f explorer.html
          echo "Preview branch: $GITHUB_REF_NAME"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy preview to Pages
        id: deploy
        uses: actions/deploy-pages@v4
