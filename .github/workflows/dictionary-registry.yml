name: Dictionary Registry checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify registry, Unicode and packet round-trips
        run: node dictionary-registry-test.cjs
